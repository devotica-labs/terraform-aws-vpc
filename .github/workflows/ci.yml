name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  # ── Stage 1: format ────────────────────────────────────────────────────
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.8" }
      - run: terraform fmt -check -recursive

  # ── Stage 2: validate ──────────────────────────────────────────────────
  validate:
    name: terraform validate
    needs: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.8" }
      - run: terraform init -backend=false
      - run: terraform validate

  # ── Stage 3: parallel quality gates ───────────────────────────────────

  tflint:
    name: tflint
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with: { tflint_version: v0.50.3 }
      - run: tflint --init && tflint --format compact

  # FIX: minimum_severity not valid — use additional_args instead
  tfsec:
    name: tfsec HIGH/CRIT
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/tfsec-action@v1.0.3
        with:
          additional_args: "--minimum-severity HIGH"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          soft_fail: true

  # FIX: gitleaks org requires paid license → run binary directly instead
  gitleaks:
    name: gitleaks
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose

  # FIX: terraform-docs — use git-push mode so it auto-commits any diff
  terraform_docs:
    name: terraform-docs
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: terraform-docs/gh-actions@v1
        with:
          working-dir: .
          output-file: README.md
          output-method: inject
          git-push: true
          git-commit-message: "docs: auto-update terraform-docs"

  # FIX: instrumenta/conftest-action@v0.5.1 does not exist
  # Run conftest binary directly instead
  conftest:
    name: conftest OPA
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC_ROLE_ARN }}
          aws-region: ap-south-1

      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.8" }

      - name: Install conftest
        run: |
          curl -sSLo conftest.tar.gz \
            https://github.com/open-policy-agent/conftest/releases/download/v0.46.0/conftest_0.46.0_Linux_x86_64.tar.gz
          tar -xzf conftest.tar.gz conftest
          mv conftest /usr/local/bin/

      - name: Generate plan JSON
        run: |
          terraform init -backend=false
          terraform plan -out=tfplan.binary \
            -var="name=ci" \
            -var='cidr_block=10.0.0.0/16' \
            -var='availability_zones=["ap-south-1a","ap-south-1b"]' \
            -var='public_subnet_cidrs=["10.0.0.0/24","10.0.1.0/24"]' \
            -var='private_subnet_cidrs=["10.0.10.0/24","10.0.11.0/24"]'
          terraform show -json tfplan.binary > tfplan.json

      - name: Run conftest
        run: conftest test tfplan.json --policy .opa/ --all-namespaces

  # FIX: unit tests — data sources removed so mock provider works cleanly
  terraform_test:
    name: terraform test (unit + contract)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.8" }
      - run: terraform init -backend=false
      - run: terraform test -filter=tests/unit.tftest.hcl
      - run: terraform test -filter=tests/contract.tftest.hcl

  checkov:
    name: checkov (inform)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true

  # FIX: infracost/actions/comment@v3 path wrong → use correct action path
  infracost:
    name: infracost (inform)
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Check API key
        id: check_key
        run: |
          if [ -z "${{ secrets.INFRACOST_API_KEY }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            echo "INFRACOST_API_KEY not set — skipping"
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Infracost
        if: steps.check_key.outputs.skip == 'false'
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Run Infracost diff
        if: steps.check_key.outputs.skip == 'false'
        run: |
          infracost diff \
            --path=. \
            --format=json \
            --out-file=/tmp/infracost.json \
            --terraform-var="name=ci" \
            --terraform-var="cidr_block=10.0.0.0/16" || true

      - name: Post Infracost comment
        if: steps.check_key.outputs.skip == 'false' && github.event_name == 'pull_request'
        run: |
          infracost comment github \
            --path=/tmp/infracost.json \
            --repo=${{ github.repository }} \
            --pull-request=${{ github.event.pull_request.number }} \
            --github-token=${{ secrets.GITHUB_TOKEN }} \
            --behavior=update

  # FIX: examples use local source (../...) since not on Registry yet
  examples_build:
    name: examples build
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [basic, complete]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: "~1.8" }
      - run: terraform init -backend=false
        working-directory: examples/${{ matrix.example }}
      - run: terraform validate
        working-directory: examples/${{ matrix.example }}

  # ── Branch protection gate ─────────────────────────────────────────────
  all_green:
    name: all checks green
    needs: [tflint, tfsec, gitleaks, terraform_docs, conftest, terraform_test, checkov, infracost, examples_build]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All CI checks passed."
